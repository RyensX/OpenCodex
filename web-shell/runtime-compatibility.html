<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OpenCodex Runtime Compatibility</title>
    <link rel="stylesheet" href="/opencodex/runtime-compatibility.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">OpenCodex Developer Diagnostics</p>
          <h1>官方运行时兼容性</h1>
          <p id="runtimeIdentity" class="muted">正在读取运行时状态…</p>
        </div>
        <div class="actions">
          <button id="refreshButton" type="button">刷新</button>
          <button id="backButton" type="button" class="secondary">返回</button>
        </div>
      </header>

      <section id="summaryCards" class="summary-grid" aria-live="polite"></section>

      <section class="panel">
        <div class="panel-heading filters">
          <div>
            <h2>修改点</h2>
            <p class="muted">按功能组查看定位、应用、验证和实际命中；未归组的基础修改点单独列出。</p>
          </div>
          <label>
            <span>类型</span>
            <select id="categoryFilter">
              <option value="">全部</option>
              <option value="web.runtime">Web 运行时</option>
              <option value="gateway.runtime">Gateway 运行时</option>
              <option value="static.cache">静态缓存</option>
            </select>
          </label>
          <label>
            <span>状态</span>
            <select id="statusFilter">
              <option value="">全部</option>
              <option value="unavailable">不可用</option>
              <option value="degraded">降级</option>
              <option value="pending">待检测</option>
              <option value="ready">已就绪</option>
              <option value="healthy">已命中</option>
              <option value="disabled">已关闭</option>
            </select>
          </label>
        </div>
        <div class="table-wrap">
          <table id="pointsTable">
            <thead>
              <tr>
                <th scope="col">修改点</th>
                <th scope="col">
                  <span class="column-heading">总状态<button class="help-button" type="button" data-help="overall" aria-label="查看总状态说明">?</button></span>
                </th>
                <th scope="col">
                  <span class="column-heading">定位<button class="help-button" type="button" data-help="location" aria-label="查看定位状态说明">?</button></span>
                </th>
                <th scope="col">
                  <span class="column-heading">应用<button class="help-button" type="button" data-help="application" aria-label="查看应用状态说明">?</button></span>
                </th>
                <th scope="col">
                  <span class="column-heading">验证<button class="help-button" type="button" data-help="verification" aria-label="查看验证状态说明">?</button></span>
                </th>
                <th scope="col">
                  <span class="column-heading">命中<button class="help-button" type="button" data-help="exercise" aria-label="查看命中状态说明">?</button></span>
                </th>
              </tr>
            </thead>
          </table>
        </div>
        <p id="emptyState" class="empty" hidden>没有符合筛选条件的修改点。</p>
      </section>

      <p id="errorBanner" class="error" hidden></p>
    </main>

    <dialog id="helpDialog" class="help-dialog" aria-labelledby="helpDialogTitle">
      <div class="help-dialog-content">
        <header class="help-dialog-header">
          <h2 id="helpDialogTitle"></h2>
          <button id="helpDialogClose" class="help-dialog-close" type="button" aria-label="关闭说明">×</button>
        </header>
        <p id="helpDialogDescription" class="help-dialog-description"></p>
        <div id="helpDialogStatuses" class="help-status-list"></div>
      </div>
    </dialog>
    <script src="/opencodex/runtime-compatibility.js"></script>
  </body>
</html>
